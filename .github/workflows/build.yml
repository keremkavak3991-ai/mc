name: Build mod
on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and run tests
        run: |
          set +e
          ./gradlew build --no-daemon > build-output.log 2>&1
          result=$?
          tail -n 100 build-output.log
          if [ "$result" -ne 0 ]; then
            echo "::error::$(tail -n 50 build-output.log | tr '\n' ' ' | cut -c 1-12000)"
            exit "$result"
          fi
      - name: Validate resources
        run: python3 -m unittest discover -s tests -v
      - name: Upload installable JAR
        uses: actions/upload-artifact@v4
        with:
          name: quiet-ledger-mod
          path: build/libs/*.jar
          if-no-files-found: error
